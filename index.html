<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Planner</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --hue: 210;
    --primary: hsl(var(--hue), 18%, 90%);
    --secondary: hsl(var(--hue), 28%, 78%);
    --accent: hsl(var(--hue), 42%, 55%);
    --text: #17202a;
    --muted: #68737d;
    --border: #aeb7bf;

    --sidebar-width: 270px;
    --topbar-height: 58px;
    --bottom-bar-height: 58px;

    --cell-size: 20px;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #eef0f2;
}

/* =========================================================
   APP
========================================================= */

.app {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    grid-template-rows: var(--topbar-height) 1fr var(--bottom-bar-height);
    width: 100vw;
    height: 100vh;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    background: white;
    border-bottom: 1px solid #d4d9dd;
    z-index: 1000;
}

.brand {
    font-weight: 700;
    font-size: 17px;
    white-space: nowrap;
}

.project-name {
    flex: 1;
    max-width: 500px;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 600;
}

.project-name:hover,
.project-name:focus {
    border-color: #c5cbd0;
    outline: none;
}

.primary-button {
    border: none;
    border-radius: 6px;
    padding: 9px 15px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
}

.primary-button:hover {
    filter: brightness(.94);
}

/* =========================================================
   DEVICE SWITCHER
========================================================= */
.device-switcher {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
}

.device-switcher-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 2px;
}

.device-button {
    border: 1px solid #cbd1d5;
    background: white;
    color: var(--text);
    border-radius: 5px;
    padding: 7px 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.device-button:hover {
    background: #f3f5f6;
}

.device-button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.device-status {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 5px;
}

.layout-mode-status {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 6px;
    border-radius: 4px;
    background: #f3f5f6;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
}

.responsive-reset-row {
    margin: -2px 0 11px;
}

.secondary-button {
    width: 100%;
    border: 1px solid #c7cdd1;
    border-radius: 5px;
    padding: 7px 8px;
    background: white;
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
}

.secondary-button:hover {
    background: #f3f5f6;
}

@media (max-width: 900px) {
    .topbar { gap: 8px; padding: 0 10px; }
    .brand { display: none; }
    .project-name { min-width: 120px; }
    .device-switcher-label { display: none; }
}

@media (max-width: 650px) {
    .app { grid-template-columns: 210px 1fr; }
    .device-button { padding: 6px 7px; }
    .project-name { max-width: 180px; }
    .primary-button { padding: 8px 9px; }
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    grid-column: 1;
    grid-row: 2 / 4;
    display: flex;
    flex-direction: column;
    background: white;
    border-right: 1px solid #d4d9dd;
    overflow: hidden;
    z-index: 500;
}

.sidebar-header {
    padding: 14px;
    border-bottom: 1px solid #e1e4e7;
}

.add-box-button {
    width: 100%;
    padding: 10px;
    border: 1px solid #c5cbd0;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-weight: 600;
}

.add-box-button:hover,
.add-box-button.active {
    border-color: var(--accent);
    background: (var(--hue), 50%, 96%);
}

.box-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.box-list-empty {
    padding: 15px 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.box-list-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 8px;
    margin-bottom: 3px;
    border: none;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text);
}

.box-list-item:hover {
    background: #f1f3f4;
}

.box-list-item.selected {
    background: (var(--hue), 60%, 93%);
}

.box-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.2);
    flex-shrink: 0;
}

.box-list-number {
    color: var(--muted);
    font-size: 11px;
    min-width: 38px;
}

.box-list-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================================================
   CANVAS AREA
========================================================= */

.canvas-area {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: auto;
}

.canvas {
    position: relative;
    width: 480px;
    height: 400px;
    margin: 40px;

    background-color: white;

    background-image:
        linear-gradient(to right, #dce1e5 1px, transparent 1px),
        linear-gradient(to bottom, #dce1e5 1px, transparent 1px);

    background-size:
        var(--preview-cell-size) var(--preview-cell-size);

    box-shadow:
        0 0 0 1px #c8cdd1;

    touch-action: none;
}

.canvas.add-mode {
    cursor: crosshair;
}

/* =========================================================
   BOX
========================================================= */

.layout-box {
    position: absolute;
    border: 2px solid rgba(60,70,80,.6);
    border-radius: 4px;
    cursor: grab;
    user-select: none;
    touch-action: none;
}

.layout-box:active {
    cursor: grabbing;
}

.layout-box.selected {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    z-index: 100;
}

.layout-box.parent-target {
    outline: 3px dashed var(--accent);
    outline-offset: 3px;
}

.box-content {
    position: absolute;
    inset: 0;
    padding: 5px;
    overflow: hidden;
    pointer-events: none;
}

.box-title {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.box-description {
    margin-top: 3px;
    font-size: 9px;
    line-height: 1.2;
    opacity: .72;
}

/* =========================================================
   RESIZE HANDLES
========================================================= */

.resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: white;
    border: 2px solid var(--accent);
    border-radius: 2px;
    z-index: 1000;
}

.resize-handle.tl {
    top: -6px;
    left: -6px;
    cursor: nwse-resize;
}

.resize-handle.tr {
    top: -6px;
    right: -6px;
    cursor: nesw-resize;
}

.resize-handle.bl {
    bottom: -6px;
    left: -6px;
    cursor: nesw-resize;
}

.resize-handle.br {
    bottom: -6px;
    right: -6px;
    cursor: nwse-resize;
}

/* =========================================================
   PROPERTY PANEL
========================================================= */

.property-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 270px;
    padding: 15px;
    background: white;
    border: 1px solid #d2d7db;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
    z-index: 5000;
}

.property-panel.hidden {
    display: none;
}

.panel-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 13px;
}

.field {
    margin-bottom: 11px;
}

.field label {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border: 1px solid #cbd1d5;
    border-radius: 5px;
    padding: 7px;
    color: var(--text);
    background: white;
}

.field textarea {
    min-height: 58px;
    resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    outline: 2px solid (var(--hue), 65%, 88%);
    border-color: var(--accent);
}

.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.number-input {
    width: 100%;
}

/* =========================================================
   COLOR ROLES
========================================================= */

.color-role {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.role-option {
    border: 1px solid #cbd1d5;
    border-radius: 5px;
    padding: 7px;
    background: white;
    cursor: pointer;
    font-size: 11px;
}

.role-option:hover {
    background: #f3f5f6;
}

.role-option.active {
    border-color: var(--accent);
    background: (var(--hue), 60%, 94%);
}

.custom-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.custom-color-row input {
    width: 45px;
    height: 30px;
    padding: 2px;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar {
    grid-column: 2;
    grid-row: 3;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    background: white;
    border-top: 1px solid #d4d9dd;
    z-index: 500;
}

.temperature-label {
    font-size: 12px;
    font-weight: 700;
}

.cool {
    color: #356b96;
}

.warm {
    color: #ad5b35;
}

.hue-slider {
    width: 260px;
}

.hue-preview {
    width: 90px;
    height: 18px;
    border-radius: 10px;
    background:
        linear-gradient(to right,
    hsl(215, 45%, 55%),
    hsl(195, 45%, 55%),
    hsl(175, 42%, 50%),
    hsl(150, 42%, 48%),
    hsl(125, 40%, 45%),
    hsl(100, 42%, 48%),
    hsl(75, 45%, 48%),
    hsl(55, 50%, 52%),
    hsl(35, 50%, 52%),
    hsl(15, 50%, 52%),
    hsl(350, 45%, 55%),
    hsl(315, 42%, 55%),
    hsl(285, 40%, 55%),
    hsl(250, 45%, 58%)
);
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,25,30,.35);
    z-index: 5000;
}

.modal-overlay.hidden {
    display: none;
}

.modal {
    width: 370px;
    max-width: calc(100vw - 30px);
    padding: 20px;
    background: white;
    border-radius: 9px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

.secondary-button {
    border: 1px solid #c7cdd1;
    border-radius: 6px;
    padding: 8px 13px;
    background: white;
    cursor: pointer;
}

/* =========================================================
   COPY MESSAGE
========================================================= */

.copy-message {
    position: fixed;
    top: 70px;
    right: 20px;
    padding: 9px 14px;
    background: #20262c;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-5px);
    transition: .2s;
    pointer-events: none;
    z-index: 6000;
}

.copy-message.show {
    opacity: 1;
    transform: translateY(0);
}

.copy-message.copy-success {
    background: #246b3c;
}

.copy-message.copy-error {
    background: #9b2c2c;
}

.grid-zoom-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 12px;
}
.grid-zoom-controls button {
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 6px;
    min-width: 32px;
    height: 30px;
    padding: 0 8px;
    cursor: pointer;
    font-weight: 600;
}
.grid-zoom-controls button:hover {
    background: #f1f5f9;
}
#zoomValue {
    min-width: 52px;
    text-align: center;
    font-size: 13px;
    color: #475569;
}


.hue-slider-green {
    accent-color: #2e8b57;
}

#hueSlider{accent-color:#4f8f4f}.hue-slider-wrap{position:relative;width:260px;height:24px;display:flex;align-items:center}.hue-slider-gradient{position:absolute;left:0;right:0;top:7px;height:10px;border-radius:999px;background:linear-gradient(to right,hsl(215,70%,55%),hsl(195,70%,55%),hsl(175,65%,50%),hsl(150,65%,48%),hsl(125,60%,45%),hsl(100,65%,48%),hsl(75,65%,48%),hsl(55,75%,52%),hsl(35,78%,52%),hsl(15,78%,52%),hsl(350,72%,55%),hsl(315,65%,55%),hsl(285,60%,55%),hsl(250,65%,58%));pointer-events:none}.hue-slider-wrap .hue-slider{position:relative;z-index:1;width:260px;background:transparent}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        Layout Planner
    </div>

    <input
        id="projectName"
        class="project-name"
        value="My Website Layout"
        aria-label="Project name"
    >

    <div class="device-switcher" aria-label="Preview device">
        <span class="device-switcher-label">Preview:</span>
        <button class="device-button active" data-device="pc">PC</button>
        <button class="device-button" data-device="tablet">Tablet</button>
        <button class="device-button" data-device="mobile">Mobile</button>
    </div>

<div class="grid-zoom-controls" aria-label="Grid zoom controls">
  <button type="button" id="zoomOutButton" title="Zoom out">−</button>
  <span id="zoomValue">100%</span>
  <button type="button" id="zoomInButton" title="Zoom in">+</button>
  <button type="button" id="zoomResetButton" title="Reset zoom">Reset</button>
</div>

    <button
        id="copyButton"
        class="primary-button"
    >
        Copy to Clipboard
    </button>

</header>


<aside class="sidebar">

    <div class="sidebar-header">

        <button
            id="addBoxButton"
            class="add-box-button"
        >
            + Add Box
        </button>

    </div>

    <div
        id="boxList"
        class="box-list"
    ></div>

</aside>


<main
    id="canvasArea"
    class="canvas-area"
>

    <div
        id="canvas"
        class="canvas"
    ></div>

    <section
        id="propertyPanel"
        class="property-panel hidden"
    >

        <div class="device-status">Editing: <strong id="deviceLabel">PC</strong></div>
        <div id="layoutModeStatus" class="layout-mode-status">Using PC base layout</div>

        <div class="panel-title">
            Box Properties
        </div>

        <div class="field">
            <label>Label</label>
            <input id="labelInput" type="text">
        </div>

        <div class="field">
            <label>Description</label>
            <textarea id="descriptionInput"></textarea>
        </div>

        <div class="field">
            <label>Type</label>
            <input
                id="typeInput"
                type="text"
                placeholder="e.g. button, input, heading, graph"
            >
        </div>

        <div class="field">
            <label>Behavior</label>
            <input
                id="behaviorInput"
                type="text"
                placeholder="What should this element do?"
            >
        </div>

        <div id="responsiveResetRow" class="responsive-reset-row">
            <button id="resetResponsiveButton" type="button" class="secondary-button">
                Reset to Base Layout
            </button>
        </div>

        <div class="field">

            <label>Parent</label>

            <select id="parentInput">
            </select>

        </div>

        <div class="field">

            <label>Color Role</label>

            <div
                id="colorRole"
                class="color-role"
            >

                <button
                    class="role-option"
                    data-role="primary"
                >
                    Primary
                </button>

                <button
                    class="role-option"
                    data-role="secondary"
                >
                    Secondary
                </button>

                <button
                    class="role-option"
                    data-role="accent"
                >
                    Accent
                </button>

                <button
                    class="role-option"
                    data-role="custom"
                >
                    Custom
                </button>

            </div>

            <div
                id="customColorRow"
                class="custom-color-row"
                style="display:none;"
            >

                <span>Custom</span>

                <input
                    id="customColorInput"
                    type="color"
                    value="#8aa8c8"
                >

            </div>

        </div>

    </section>

</main>


<footer class="bottom-bar">

    <div class="hue-slider-wrap">
        <input
            id="hueSlider"
            class="hue-slider"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Color gradient"
        >
        <div id="hueGradient" class="hue-slider-gradient"></div>
    </div>

</footer>

</div>



<div
    id="copyMessage"
    class="copy-message"
>
    Copied to clipboard
</div>


<script>
/* =========================================================
   CONFIG
========================================================= */
let GRID_COLUMNS = 24;
let GRID_ROWS = 20;
const BASE_CELL_SIZE = 20;
const MAX_DEPTH = 5;

const DEVICE_CONFIG = {
    pc: { label: "PC", columns: 24, rows: 20, defaultWidth: 1200 },
    tablet: { label: "Tablet", columns: 18, rows: 24, defaultWidth: 768 },
    mobile: { label: "Mobile", columns: 12, rows: 28, defaultWidth: 390 }
};

let activeDevice = "pc";
let previewWidth = 1200;


// Core app state
let boxes = [];
let selectedBoxId = null;
let nextBoxNumber = 1;
let addMode = false;

/* =========================================================
   RESPONSIVE LAYOUT MODEL

   PC is the BASE layout.
   Tablet and Mobile store only user-created overrides.
   If there is no override, their layout is derived from PC.
========================================================= */
function geometryFromBox(box) {
    return { x: box.x, y: box.y, width: box.width, height: box.height };
}

function cloneGeometry(geometry) {
    return {
        x: Number(geometry.x) || 0,
        y: Number(geometry.y) || 0,
        width: Math.max(1, Number(geometry.width) || 1),
        height: Math.max(1, Number(geometry.height) || 1)
    };
}

function ensureResponsiveModel(box) {
    if (!box.baseLayout) {
        if (box.layouts && box.layouts.pc) {
            box.baseLayout = cloneGeometry(box.layouts.pc);
        } else {
            box.baseLayout = geometryFromBox(box);
        }
    }

    if (!box.responsiveOverrides) {
        box.responsiveOverrides = { tablet: null, mobile: null };
    }

    /* Migrate the previous version's device layouts without losing work. */
    if (box.layouts) {
        if (!box.responsiveOverrides.tablet && box.layouts.tablet) {
            box.responsiveOverrides.tablet = cloneGeometry(box.layouts.tablet);
        }
        if (!box.responsiveOverrides.mobile && box.layouts.mobile) {
            box.responsiveOverrides.mobile = cloneGeometry(box.layouts.mobile);
        }
        delete box.layouts;
    }
}

function getBaseGeometry(box) {
    ensureResponsiveModel(box);
    return cloneGeometry(box.baseLayout);
}

function getResponsiveOverride(box, device) {
    ensureResponsiveModel(box);
    return box.responsiveOverrides[device] || null;
}

function getEffectiveGeometry(box, device = activeDevice, cache = {}) {
    ensureResponsiveModel(box);
    const key = `${device}:${box.id}`;
    if (cache[key]) return cache[key];

    if (device === "pc") {
        cache[key] = getBaseGeometry(box);
        return cache[key];
    }

    const override = getResponsiveOverride(box, device);
    if (override) {
        cache[key] = cloneGeometry(override);
        return cache[key];
    }

    const base = getBaseGeometry(box);
    const target = DEVICE_CONFIG[device];
    const pc = DEVICE_CONFIG.pc;

    const geometry = {
        x: Math.round(base.x * target.columns / pc.columns),
        y: Math.round(base.y * target.rows / pc.rows),
        width: Math.max(1, Math.round(base.width * target.columns / pc.columns)),
        height: Math.max(1, Math.round(base.height * target.rows / pc.rows))
    };

    /* Automatically derived layouts should remain inside parents. */
    if (box.parentId) {
        const parent = getBox(box.parentId);
        if (parent) {
            const parentGeometry = getEffectiveGeometry(parent, device, cache);
            geometry.width = Math.min(geometry.width, parentGeometry.width);
            geometry.height = Math.min(geometry.height, parentGeometry.height);
            geometry.x = clamp(geometry.x, 0, Math.max(0, parentGeometry.width - geometry.width));
            geometry.y = clamp(geometry.y, 0, Math.max(0, parentGeometry.height - geometry.height));
        }
    }

    cache[key] = geometry;
    return geometry;
}

function saveCurrentDeviceLayouts() {
    boxes.forEach(box => ensureResponsiveModel(box));

    boxes.forEach(box => {
        if (activeDevice === "pc") {
            box.baseLayout = geometryFromBox(box);
        } else if (box._layoutOverrideDirty && box._layoutOverrideDirty[activeDevice]) {
            box.responsiveOverrides[activeDevice] = geometryFromBox(box);
            box._layoutOverrideDirty[activeDevice] = false;
        }
    });
}

function markLayoutOverride(box) {
    ensureResponsiveModel(box);

    if (activeDevice === "pc") {
        box.baseLayout = geometryFromBox(box);
        return;
    }

    if (!box._layoutOverrideDirty) box._layoutOverrideDirty = {};
    box._layoutOverrideDirty[activeDevice] = true;
    box.responsiveOverrides[activeDevice] = geometryFromBox(box);
}


function applyDevice(device) {
    saveCurrentDeviceLayouts();
    ensureLayouts();

    activeDevice = device;
    GRID_COLUMNS = DEVICE_CONFIG[device].columns;
    GRID_ROWS = DEVICE_CONFIG[device].rows;

    /* Give each device a sensible starting preview width. */
    if (device === "pc") previewWidth = 1200;
    if (device === "tablet") previewWidth = 768;
    if (device === "mobile") previewWidth = 390;

    const cache = {};
    boxes.forEach(box => {
        const layout = getEffectiveGeometry(box, device, cache);
        box.x = layout.x;
        box.y = layout.y;
        box.width = layout.width;
        box.height = layout.height;
    });

    updatePreviewSize();

    document.querySelectorAll(".device-button").forEach(button => {
        button.classList.toggle("active", button.dataset.device === activeDevice);
    });

    const deviceLabel = document.getElementById("deviceLabel");
    if (deviceLabel) deviceLabel.textContent = DEVICE_CONFIG[activeDevice].label;

    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}

function ensureLayouts() {
    boxes.forEach(box => ensureResponsiveModel(box));
}

/* =========================================================
   HELPERS
========================================================= */
function getBox(id) {
    return boxes.find(box => box.id === id);
}

function getChildren(parentId) {
    return boxes.filter(box => box.parentId === parentId);
}

function getAncestors(box) {
    const result = [];
    let current = getBox(box.parentId);

    while (current) {
        result.push(current);
        current = getBox(current.parentId);
    }

    return result;
}

function getDepth(box) {
    return getAncestors(box).length + 1;
}

function isDescendant(boxId, possibleAncestorId) {
    let current = getBox(boxId);

    while (current && current.parentId) {
        if (current.parentId === possibleAncestorId) {
            return true;
        }
        current = getBox(current.parentId);
    }

    return false;
}

/* =========================================================
   COORDINATES
========================================================= */

/*
  Box x/y are LOCAL to their parent.
  For display and collision detection we calculate ABSOLUTE
  canvas coordinates.
*/
function getAbsolutePosition(box) {
    let x = box.x;
    let y = box.y;
    let parent = getBox(box.parentId);

    while (parent) {
        x += parent.x;
        y += parent.y;
        parent = getBox(parent.parentId);
    }

    return { x, y };
}

function getAbsoluteRect(box) {
    const pos = getAbsolutePosition(box);

    return {
        x: pos.x,
        y: pos.y,
        width: box.width,
        height: box.height
    };
}

function localFromAbsolute(box, absoluteX, absoluteY, parentId) {
    if (!parentId) {
        return {
            x: absoluteX,
            y: absoluteY
        };
    }

    const parent = getBox(parentId);
    if (!parent) {
        return {
            x: absoluteX,
            y: absoluteY
        };
    }

    const parentPos = getAbsolutePosition(parent);

    return {
        x: absoluteX - parentPos.x,
        y: absoluteY - parentPos.y
    };
}

/* =========================================================
   GEOMETRY
========================================================= */
function overlaps(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function contains(parent, child) {
    return (
        child.x >= parent.x &&
        child.y >= parent.y &&
        child.x + child.width <= parent.x + parent.width &&
        child.y + child.height <= parent.y + parent.height
    );
}

function snapPixelsToCells(pixelValue) {
    return Math.round(pixelValue / getDisplayCellSize());
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

/* =========================================================
   VALIDATION
========================================================= */
function canPlaceAbsolute(box, absoluteX, absoluteY, width, height, parentId) {
    const test = {
        x: absoluteX,
        y: absoluteY,
        width,
        height
    };

    if (
        absoluteX < 0 ||
        absoluteY < 0 ||
        absoluteX + width > GRID_COLUMNS ||
        absoluteY + height > GRID_ROWS
    ) {
        return false;
    }

    if (parentId) {
        const parent = getBox(parentId);

        if (!parent) return false;

        const parentRect = getAbsoluteRect(parent);

        if (!contains(parentRect, test)) {
            return false;
        }
    }

    for (const other of boxes) {
        if (other.id === box.id) continue;
        if (other.parentId !== parentId) continue;

        if (overlaps(test, getAbsoluteRect(other))) {
            return false;
        }
    }

    return true;
}

function canResizeParent(box, newAbsoluteRect) {
    const children = getChildren(box.id);

    for (const child of children) {
        if (!contains(newAbsoluteRect, getAbsoluteRect(child))) {
            return false;
        }
    }

    return true;
}

   COLORS

/* =========================================================
   GREEN COLOR SCHEMES
========================================================= */
function greenHueFromSlider() {
    // The slider still provides variety, but remains in a green family:
    // emerald -> teal-green -> leaf -> forest.
    const t = Number(hueSlider.value) / 100;
    return Math.round(135 + t * 65);
}

function currentHue(){
 const t=Number(hueSlider.value)/100; const s=[{t:0,h:215},{t:.08,h:195},{t:.16,h:175},{t:.24,h:150},{t:.32,h:125},{t:.40,h:100},{t:.48,h:75},{t:.56,h:55},{t:.64,h:35},{t:.72,h:15},{t:.80,h:350},{t:.88,h:315},{t:0.94,h:285},{t:1,h:250}];
 for(let i=0;i<s.length-1;i++){if(t<=s[i+1].t){const a=s[i],b=s[i+1],q=(t-a.t)/(b.t-a.t);return Math.round(a.h+(b.h-a.h)*q);}} return 55;
}

function getBoxColor(box) {
    const hue = currentHue();

    switch (box.colorRole) {
        case "secondary":
            return `hsl(${hue},45%,78%)`;
        case "accent":
            return `hsl(${hue},70%,55%)`;
        case "custom":
            return box.customColor;
        default:
            return `hsl(${hue},30%,90%)`;
    }
}

function contrastColor(hex) {
    const value = String(hex || "#8aa8c8").replace("#", "");

    if (value.length !== 6) return "#17202a";

    const r = parseInt(value.substring(0, 2), 16);
    const g = parseInt(value.substring(2, 4), 16);
    const b = parseInt(value.substring(4, 6), 16);

    const brightness = (r * 299 + g * 587 + b * 114) / 1000;

    return brightness > 150 ? "#17202a" : "#ffffff";
}

function getBoxTextColor(box) {
    if (box.colorRole === "custom") {
        return contrastColor(box.customColor);
    }

    if (box.colorRole === "accent") {
        return "#ffffff";
    }

    return "#17202a";
}

/* =========================================================
   RENDER BOXES
========================================================= */

/*
  IMPORTANT:
  Every box is a direct child of the canvas.
  Nested boxes are positioned using their ABSOLUTE position.
  This prevents DOM nesting/re-rendering from breaking drag.
*/
function renderBoxes() {
    canvas.querySelectorAll(".layout-box").forEach(element => element.remove());

    const sorted = [...boxes].sort((a, b) => {
        const depthDifference = getDepth(a) - getDepth(b);
        return depthDifference || a.number - b.number;
    });

    sorted.forEach(box => {
        const element = document.createElement("div");
        element.className = "layout-box";
        element.dataset.id = box.id;

        const absolute = getAbsolutePosition(box);

        element.style.left = `${absolute.x * getDisplayCellSize()}px`;
        element.style.top = `${absolute.y * getDisplayCellSize()}px`;
        element.style.width = `${box.width * getDisplayCellSize()}px`;
        element.style.height = `${box.height * getDisplayCellSize()}px`;
        element.style.background = getBoxColor(box);
        element.style.color = getBoxTextColor(box);

        /*
          Parents go behind children.
        */
        element.style.zIndex =
            box.id === selectedBoxId
                ? 1000
                : 10 + getDepth(box);

        if (box.id === selectedBoxId) {
            element.classList.add("selected");
        }

        element.innerHTML = `
            <div class="box-content">
                <div class="box-title">
                    ${escapeHTML(box.label || `Box ${box.number}`)}
                </div>
                <div class="box-description">
                    ${escapeHTML(box.description || "")}
                </div>
            </div>
        `;

        if (box.id === selectedBoxId) {
            ["tl", "tr", "bl", "br"].forEach(position => {
                const handle = document.createElement("div");
                handle.className = `resize-handle ${position}`;
                handle.dataset.handle = position;
                element.appendChild(handle);
            });
        }

        /*
          ONE pointerdown listener.
          The actual move is handled by window listeners so
          the box can never lose the drag because of rendering.
        */
        element.addEventListener("pointerdown", boxPointerDown);

        canvas.appendChild(element);
    });
}

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   PARENT SELECT
========================================================= */
function populateParentSelect(box) {
    const select = document.getElementById("parentInput");
    select.innerHTML = "";

    const none = document.createElement("option");
    none.value = "";
    none.textContent = "None (Top Level)";
    none.selected = !box.parentId;
    select.appendChild(none);

    boxes.forEach(candidate => {
        if (candidate.id === box.id) return;

        if (isDescendant(candidate.id, box.id)) return;

        if (getDepth(candidate) >= MAX_DEPTH) return;

        const option = document.createElement("option");
        option.value = candidate.id;
        option.textContent =
            `Box ${candidate.number} (${candidate.label || "Untitled"})`;

        option.selected = candidate.id === box.parentId;

        select.appendChild(option);
    });
}

/* =========================================================
   CHANGE PARENT
========================================================= */
document.getElementById("parentInput").addEventListener("change", event => {
    const box = getBox(selectedBoxId);
    if (!box) return;

    const oldParentId = box.parentId;
    const oldX = box.x;
    const oldY = box.y;

    const newParentId = event.target.value || null;

    if (newParentId === oldParentId) return;

    if (newParentId) {
        const newParent = getBox(newParentId);

        if (
            !newParent ||
            newParent.id === box.id ||
            isDescendant(newParent.id, box.id) ||
            getDepth(newParent) >= MAX_DEPTH
        ) {
            updatePropertyPanel();
            return;
        }
    }

    const absolute = getAbsolutePosition(box);
    const local = localFromAbsolute(
        box,
        absolute.x,
        absolute.y,
        newParentId
    );

    if (
        !canPlaceAbsolute(
            box,
            absolute.x,
            absolute.y,
            box.width,
            box.height,
            newParentId
        )
    ) {
        box.parentId = oldParentId;
        box.x = oldX;
        box.y = oldY;

        updatePropertyPanel();
        return;
    }

    box.parentId = newParentId;
    box.x = local.x;
    box.y = local.y;
    markLayoutOverride(box);

    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
});

function cancelAddMode() {

    creating = false;
    createStart = null;

    canvas.classList.remove("add-mode");

/* =========================================================
   CREATE BOX BY DRAGGING
========================================================= */
canvas.addEventListener("pointerdown", event => {
    if (!addMode) return;

    /* Existing boxes are ignored; any other part of the planning surface can start creation. */
    if (event.target.closest && event.target.closest(".layout-box")) return;

    event.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const x = clamp(
        snapPixelsToCells((event.clientX - rect.left) / gridZoom),
        0,
        GRID_COLUMNS - 1
    );
    const y = clamp(
        snapPixelsToCells((event.clientY - rect.top) / gridZoom),
        0,
        GRID_ROWS - 1
    );

    createStart = { x, y };
    creating = true;
    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointerup", event => {
    if (!creating || !createStart) return;

    event.preventDefault();
    creating = false;

    if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
    }

    const rect = canvas.getBoundingClientRect();
    const endX = clamp(
        snapPixelsToCells((event.clientX - rect.left) / gridZoom),
        0,
        GRID_COLUMNS - 1
    );
    const endY = clamp(
        snapPixelsToCells((event.clientY - rect.top) / gridZoom),
        0,
        GRID_ROWS - 1
    );

    let x = Math.min(createStart.x, endX);
    let y = Math.min(createStart.y, endY);
    let width = Math.abs(endX - createStart.x) + 1;
    let height = Math.abs(endY - createStart.y) + 1;

    width = Math.min(width, GRID_COLUMNS - x);
    height = Math.min(height, GRID_ROWS - y);
    createStart = null;

    const testRect = { x, y, width, height };
    const collision = boxes.some(other => overlaps(testRect, getAbsoluteRect(other)));

    if (collision) {
        alert("This box overlaps another box. Add Box mode has been cancelled.");
        cancelAddMode();
        return;
    }

    const number = nextBoxNumber;
    const box = {
        id: typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : `box-${Date.now()}-${Math.random()}`,
        number,
        label: `Box ${number}`,
        description: "",
        type: "",
        behavior: "",
        x,
        y,
        width,
        height,
        parentId: null,
        colorRole: "primary",
        customColor: "#8aa8c8",
        baseLayout: null,
        responsiveOverrides: { tablet: null, mobile: null }
    };

    if (!canPlaceAbsolute(box, x, y, width, height, null)) {
        alert("There is no room for a new box here. Add Box mode has been cancelled.");
        cancelAddMode();
        return;
    }

    boxes.push(box);
    nextBoxNumber++;
    ensureResponsiveModel(box);

    if (activeDevice === "pc") {
        box.baseLayout = geometryFromBox(box);
    } else {
        box.responsiveOverrides[activeDevice] = geometryFromBox(box);
    }

    ensureLayouts();
    cancelAddMode();
    selectBox(box.id);
});

canvas.addEventListener("pointercancel", () => {
    creating = false;
    createStart = null;
});

/* =========================================================
   CANVAS BOX POINTER DOWN
========================================================= */
function boxPointerDown(event) {
    if (addMode) return;

    event.preventDefault();
    event.stopPropagation();

    const element =
        event.currentTarget;

    const box =
        getBox(element.dataset.id);

    if (!box) return;

    /*
      CRITICAL FIX:
      Do NOT call selectBox() here because selectBox()
      re-renders and destroys the element that received
      pointerdown.

      Instead, update selection without rebuilding boxes.
    */
    selectBoxWithoutRerender(box.id);

    const handle =
        event.target.closest(".resize-handle");

    if (handle) {
        beginResize(
            event,
            box,
            handle.dataset.handle,
            element
        );
        return;
    }

    beginDrag(
        event,
        box,
        element
    );
}

/* =========================================================
   DRAGGING
========================================================= */
function beginDrag(event, box, element) {
    const absolute = getAbsolutePosition(box);

    interaction = {
        type: "drag",
        boxId: box.id,
        pointerId: event.pointerId,

        startMouseX: event.clientX,
        startMouseY: event.clientY,

        startAbsoluteX: absolute.x,
        startAbsoluteY: absolute.y,

        originalX: box.x,
        originalY: box.y,
        originalParentId: box.parentId,

        currentParentId: box.parentId,

        element
    };

    /*
      Listen on WINDOW.
      This is more reliable than attaching pointermove
      to the box itself.
    */
    window.addEventListener(
        "pointermove",
        handleDrag,
        { passive: false }
    );

    window.addEventListener(
        "pointerup",
        handleDragEnd,
        { once: true }
    );

    window.addEventListener(
        "pointercancel",
        handleDragEnd,
        { once: true }
    );
}

function handleDrag(event) {
    if (
        !interaction ||
        interaction.type !== "drag"
    ) {
        return;
    }

    event.preventDefault();

    const box = getBox(interaction.boxId);
    if (!box) return;

    const dx =
        snapPixelsToCells(
            event.clientX -
            interaction.startMouseX
        );

    const dy =
        snapPixelsToCells(
            event.clientY -
            interaction.startMouseY
        );

    const newAbsoluteX =
        interaction.startAbsoluteX + dx;

    const newAbsoluteY =
        interaction.startAbsoluteY + dy;

    /*
      Determine whether the box is completely inside
      another box. Pick the deepest valid parent.
    */
    const targetParent =
        findParentForRect(
            box,
            newAbsoluteX,
            newAbsoluteY,
            box.width,
            box.height
        );

    highlightParent(targetParent);

    let proposedParent = box.parentId;

    /*
      If the box is completely inside another box,
      nest it.
    */
    if (
        targetParent &&
        targetParent.id !== box.id &&
        !isDescendant(targetParent.id, box.id) &&
        getDepth(targetParent) < MAX_DEPTH
    ) {
        proposedParent = targetParent.id;
    } else if (!targetParent) {
        /*
          If a nested box is dragged completely outside
          its current parent, allow it to become top-level.
        */
        if (box.parentId) {
            const currentParent =
                getAbsoluteRect(getBox(box.parentId));

            const testRect = {
                x: newAbsoluteX,
                y: newAbsoluteY,
                width: box.width,
                height: box.height
            };

            if (!contains(currentParent, testRect)) {
                proposedParent = null;
            }
        }
    }

    /*
      Convert absolute coordinates into the coordinates
      required by the proposed parent.
    */
    const local =
        localFromAbsolute(
            box,
            newAbsoluteX,
            newAbsoluteY,
            proposedParent
        );

    /*
      Validate before changing the model.
    */
    if (
        !canPlaceAbsolute(
            box,
            newAbsoluteX,
            newAbsoluteY,
            box.width,
            box.height,
            proposedParent
        )
    ) {
        return;
    }

    box.parentId = proposedParent;
    box.x = local.x;
    box.y = local.y;

    interaction.currentParentId = proposedParent;

    /*
      CRITICAL:
      Move the EXISTING DOM element.
      Do NOT renderBoxes() here.
    */
    interaction.element.style.left =
        `${newAbsoluteX * getDisplayCellSize()}px`;

    interaction.element.style.top =
        `${newAbsoluteY * getDisplayCellSize()}px`;
}

function handleDragEnd() {
    if (!interaction) return;

    window.removeEventListener(
        "pointermove",
        handleDrag
    );

    clearParentHighlight();

    const box = getBox(interaction.boxId);

    if (box) {
        const absolute =
            getAbsolutePosition(box);

        if (
            !canPlaceAbsolute(
                box,
                absolute.x,
                absolute.y,
                box.width,
                box.height,
                box.parentId
            )
        ) {
            box.parentId =
                interaction.originalParentId;

            box.x =
                interaction.originalX;

            box.y =
                interaction.originalY;
        }
    }

    if (box) markLayoutOverride(box);

    interaction = null;

    /*
      Safe to render AFTER the pointer interaction is over.
    */
    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}

/* =========================================================
   FIND PARENT
========================================================= */
function findParentForRect(
    box,
    absoluteX,
    absoluteY,
    width,
    height
) {
    const test = {
        x: absoluteX,
        y: absoluteY,
        width,
        height
    };

    let best = null;

    boxes.forEach(candidate => {
        if (candidate.id === box.id) return;

        if (isDescendant(candidate.id, box.id)) return;

        if (getDepth(candidate) >= MAX_DEPTH) return;

        const candidateRect =
            getAbsoluteRect(candidate);

        if (contains(candidateRect, test)) {
            if (
                !best ||
                getDepth(candidate) > getDepth(best)
            ) {
                best = candidate;
            }
        }
    });

    return best;
}

function highlightParent(box) {
    canvas.querySelectorAll(".parent-target")
        .forEach(element =>
            element.classList.remove("parent-target")
        );

    if (!box) return;

    const element =
        canvas.querySelector(
            `[data-id="${box.id}"]`
        );

    if (element) {
        element.classList.add("parent-target");
    }
}

function clearParentHighlight() {
    canvas.querySelectorAll(".parent-target")
        .forEach(element =>
            element.classList.remove("parent-target")
        );
}

/* =========================================================
   RESIZING
========================================================= */
function beginResize(
    event,
    box,
    handle,
    element
) {
    const absolute =
        getAbsolutePosition(box);

    interaction = {
        type: "resize",
        boxId: box.id,
        handle,
        pointerId: event.pointerId,

        startMouseX: event.clientX,
        startMouseY: event.clientY,

        startX: absolute.x,
        startY: absolute.y,

        startWidth: box.width,
        startHeight: box.height,

        originalX: box.x,
        originalY: box.y,

        element
    };

    window.addEventListener(
        "pointermove",
        handleResize,
        { passive: false }
    );

    window.addEventListener(
        "pointerup",
        handleResizeEnd,
        { once: true }
    );

    window.addEventListener(
        "pointercancel",
        handleResizeEnd,
        { once: true }
    );
}

function handleResize(event) {
    if (
        !interaction ||
        interaction.type !== "resize"
    ) {
        return;
    }

    event.preventDefault();

    const box =
        getBox(interaction.boxId);

    if (!box) return;

    const dx =
        snapPixelsToCells(
            event.clientX -
            interaction.startMouseX
        );

    const dy =
        snapPixelsToCells(
            event.clientY -
            interaction.startMouseY
        );

    let x = interaction.startX;
    let y = interaction.startY;

    let width = interaction.startWidth;
    let height = interaction.startHeight;

    if (interaction.handle.includes("r")) {
        width =
            interaction.startWidth + dx;
    }

    if (interaction.handle.includes("l")) {
        x =
            interaction.startX + dx;

        width =
            interaction.startWidth - dx;
    }

    if (interaction.handle.includes("b")) {
        height =
            interaction.startHeight + dy;
    }

    if (interaction.handle.includes("t")) {
        y =
            interaction.startY + dy;

        height =
            interaction.startHeight - dy;
    }

    if (width < 1 || height < 1) return;

    /*
      Canvas boundaries.
    */
    if (
        x < 0 ||
        y < 0 ||
        x + width > GRID_COLUMNS ||
        y + height > GRID_ROWS
    ) {
        return;
    }

    /*
      Parent boundaries.
    */
    if (box.parentId) {
        const parent =
            getAbsoluteRect(
                getBox(box.parentId)
            );

        if (
            x < parent.x ||
            y < parent.y ||
            x + width > parent.x + parent.width ||
            y + height > parent.y + parent.height
        ) {
            return;
        }
    }

    if (
        !canPlaceAbsolute(
            box,
            x,
            y,
            width,
            height,
            box.parentId
        )
    ) {
        return;
    }

    const newRect = {
        x,
        y,
        width,
        height
    };

    if (!canResizeParent(box, newRect)) {
        return;
    }

    const local =
        localFromAbsolute(
            box,
            x,
            y,
            box.parentId
        );

    box.x = local.x;
    box.y = local.y;
    box.width = width;
    box.height = height;

    /*
      Update the EXISTING DOM element only.
    */
    interaction.element.style.left =
        `${x * getDisplayCellSize()}px`;

    interaction.element.style.top =
        `${y * getDisplayCellSize()}px`;

    interaction.element.style.width =
        `${width * getDisplayCellSize()}px`;

    interaction.element.style.height =
        `${height * getDisplayCellSize()}px`;
}

function handleResizeEnd() {
    if (!interaction) return;

    window.removeEventListener(
        "pointermove",
        handleResize
    );

    const resizedBox = getBox(interaction.boxId);
    if (resizedBox) markLayoutOverride(resizedBox);

    interaction = null;

    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}

/* =========================================================
   DELETE
========================================================= */
document.addEventListener("keydown", event => {
    const tag =
        event.target.tagName;

    if (
        tag === "INPUT" ||
        tag === "TEXTAREA" ||
        tag === "SELECT"
    ) {
        return;
    }

    if (
        (event.key === "Delete" ||
         event.key === "Backspace") &&
        selectedBoxId
    ) {
        event.preventDefault();
        deleteBox(selectedBoxId);
    }

    if (event.key === "Escape") {
        addMode = false;

        addBoxButton.classList.remove("active");
        canvas.classList.remove("add-mode");

        clearParentHighlight();

        if (interaction) {
            interaction = null;
        }
    }
});

function deleteBox(id) {
    const ids = new Set([id]);
    let changed = true;

    while (changed) {
        changed = false;

        boxes.forEach(box => {
            if (
                box.parentId &&
                ids.has(box.parentId) &&
                !ids.has(box.id)
            ) {
                ids.add(box.id);
                changed = true;
            }
        });
    }

    boxes =
        boxes.filter(box => !ids.has(box.id));

    selectedBoxId = null;

    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}

/* =========================================================
   CANVAS SELECTION
========================================================= */
canvas.addEventListener("pointerdown", event => {
    if (
        event.target === canvas &&
        !addMode &&
        !interaction
    ) {
        selectedBoxId = null;

        renderBoxes();
        renderSidebar();
        updatePropertyPanel();
    }
});

/* =========================================================
   COPY
========================================================= */
function positionText(box) {
    const absolute =
        getAbsolutePosition(box);

    const startColumn =
        absolute.x + 1;

    const endColumn =
        absolute.x + box.width;

    const startRow =
        absolute.y + 1;

    const endRow =
        absolute.y + box.height;

    const columns =
        startColumn === endColumn
            ? `${startColumn}`
            : `${startColumn}-${endColumn}`;

    const rows =
        startRow === endRow
            ? `${startRow}`
            : `${startRow}-${endRow}`;

    return `Row ${rows}, Columns ${columns}`;
}

function hexFromColor(color) {
    const match = String(color || "").match(/hsl\(([-\d.]+),\s*([-\d.]+)%,\s*([-\d.]+)%\)/i);
    if (!match) return color;

    const h = ((Number(match[1]) % 360) + 360) % 360;
    const s = Number(match[2]) / 100;
    const l = Number(match[3]) / 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;

    if (h < 60) [r,g,b] = [c,x,0];
    else if (h < 120) [r,g,b] = [x,c,0];
    else if (h < 180) [r,g,b] = [0,c,x];
    else if (h < 240) [r,g,b] = [0,x,c];
    else if (h < 300) [r,g,b] = [x,0,c];
    else [r,g,b] = [c,0,x];

    return "#" + [r,g,b]
        .map(value => Math.round((value + m) * 255).toString(16).padStart(2, "0"))
        .join("");
}

function colorInfo(box) {
    let role;
    if (box.colorRole === "primary") role = "Primary (60%)";
    else if (box.colorRole === "secondary") role = "Secondary (30%)";
    else if (box.colorRole === "accent") role = "Accent (10%)";
    else role = "Custom";

    const cssColor = getBoxColor(box);
    const hex = box.colorRole === "custom" ? box.customColor : hexFromColor(cssColor);
    return { role, hex, cssColor };
}

function layoutText(box, device) {
    const base = getBaseGeometry(box);
    if (device === "pc") {
        return `X ${base.x + 1}, Y ${base.y + 1}, Width ${base.width}, Height ${base.height} (BASE)`;
    }

    const override = getResponsiveOverride(box, device);
    const effective = getEffectiveGeometry(box, device, {});

    if (override) {
        return `X ${effective.x + 1}, Y ${effective.y + 1}, Width ${effective.width}, Height ${effective.height} (OVERRIDE)`;
    }

    return `Auto: X ${effective.x + 1}, Y ${effective.y + 1}, Width ${effective.width}, Height ${effective.height}`;
}


/* =========================================================
   GRID-ONLY ZOOM
========================================================= */
let gridZoom = 1;
const MIN_GRID_ZOOM = 0.5, MAX_GRID_ZOOM = 2.5, GRID_ZOOM_STEP = 0.1;
function applyGridZoom(){const v=document.getElementById("zoomValue"),c=document.getElementById("canvas"),a=document.getElementById("canvasArea");if(v)v.textContent=`${Math.round(gridZoom*100)}%`;if(c){const w=Number(previewWidth)||1200,ht=GRID_ROWS*getDisplayCellSize();c.style.transformOrigin="top left";c.style.transform=`scale(${gridZoom})`;c.style.width=`${w}px`;c.style.height=`${ht}px`;c.style.marginRight=`${Math.max(0,w*(gridZoom-1))}px`;c.style.marginBottom=`${Math.max(0,ht*(gridZoom-1))}px`;}if(a)a.style.overflow="auto";}
document.getElementById("zoomInButton")?.addEventListener("click",()=>{gridZoom=Math.min(MAX_GRID_ZOOM,+(gridZoom+GRID_ZOOM_STEP).toFixed(2));applyGridZoom();});
document.getElementById("zoomOutButton")?.addEventListener("click",()=>{gridZoom=Math.max(MIN_GRID_ZOOM,+(gridZoom-GRID_ZOOM_STEP).toFixed(2));applyGridZoom();});
document.getElementById("zoomResetButton")?.addEventListener("click",()=>{gridZoom=1;applyGridZoom();});

applyGridZoom();

function generateExportText() {
    ensureLayouts();

    const project = projectNameInput.value.trim() || "Untitled Project";
    const hue = currentHue();

    const primary = hexFromColor(`hsl(${hue},25%,90%)`);
    const secondary = hexFromColor(`hsl(${hue},35%,78%)`);
    const accent = hexFromColor(`hsl(${hue},50%,55%)`);

    const lines = [];

    function width(box, device) {
        const layout = getEffectiveGeometry(box, device, {});
        const ratio = layout.width / DEVICE_CONFIG[device].columns;

        if (ratio >= 0.85) return "full";
        if (ratio >= 0.60) return "large";
        if (ratio >= 0.35) return "medium";
        return "small";
    }

    function position(box, device) {
        const layout = getEffectiveGeometry(box, device, {});
        const cfg = DEVICE_CONFIG[device];

        const cx = (layout.x + layout.width / 2) / cfg.columns;
        const cy = (layout.y + layout.height / 2) / cfg.rows;

        const horizontal =
            cx < 0.33 ? "left" :
            cx > 0.67 ? "right" :
            "center";

        const vertical =
            cy < 0.33 ? "top" :
            cy > 0.67 ? "bottom" :
            "middle";

        return `${vertical}-${horizontal}`;
    }

    lines.push("AI WEB APP SPECIFICATION");
    lines.push("========================");
    lines.push("");
    lines.push(`PROJECT: ${project}`);
    lines.push("");

    lines.push("DESIGN DIRECTION");
    lines.push("----------------");
    lines.push(`Primary: ${primary}`);
    lines.push(`Secondary: ${secondary}`);
    lines.push(`Accent: ${accent}`);
    lines.push(`Hue: approximately ${hue}°`);
    lines.push("Use these as visual references, not fixed colors.");
    lines.push("");

    lines.push("IMPORTANT LAYOUT RULE");
    lines.push("----------------------");
    lines.push("The planner grid is only a planning tool.");
    lines.push("Do NOT recreate the grid.");
    lines.push("Do NOT use planner coordinates, cell counts, widths, or heights as fixed CSS.");
    lines.push("Use responsive HTML/CSS with Grid, Flexbox, flexible sizing, and media/container queries.");
    lines.push("");

    lines.push("PAGE ELEMENTS");
    lines.push("-------------");

    boxes.forEach(box => {
        const parent = getBox(box.parentId);
        const color = colorInfo(box);

        lines.push("");
        lines.push(`ELEMENT: ${box.label || `Box ${box.number}`}`);

        if (box.type) {
            lines.push(`Type: ${box.type}`);
        }

        if (box.description) {
            lines.push(`Purpose: ${box.description}`);
        }

        if (box.behavior) {
            lines.push(`Behavior: ${box.behavior}`);
        }

        lines.push(
            `Hierarchy: ${
                parent
                    ? `Inside ${parent.label || `Box ${parent.number}`}`
                    : "Top-level"
            }`
        );

        lines.push(`Color: ${color.role}; ${color.hex}`);

        lines.push(
            `Layout: Desktop ${position(box, "pc")}/${width(box, "pc")}; ` +
            `Tablet ${position(box, "tablet")}/${width(box, "tablet")}; ` +
            `Mobile ${position(box, "mobile")}/${width(box, "mobile")}.`
        );

        if (getResponsiveOverride(box, "tablet")) {
            lines.push("Tablet: use the intentionally planned responsive arrangement.");
        }

        if (getResponsiveOverride(box, "mobile")) {
            lines.push("Mobile: use the intentionally planned responsive arrangement.");
        }
    });

    lines.push("");
    lines.push("FUNCTIONAL REQUIREMENTS");
    lines.push("-----------------------");

    boxes.forEach(box => {
        if (!box.behavior) return;

        lines.push(
            `${box.label || `Box ${box.number}`}: ${box.behavior}`
        );
    });

    lines.push("");
    lines.push("RESPONSIVE REQUIREMENTS");
    lines.push("-----------------------");
    lines.push("Desktop establishes the main composition.");
    lines.push("Tablet preserves hierarchy while allowing resizing, wrapping, stacking, or repositioning.");
    lines.push("Mobile prioritizes usability, readable content, and sensible stacking.");
    lines.push("Preserve the relationships and hierarchy represented by the planner.");
    lines.push("");

    lines.push("IMPLEMENTATION RULES");
    lines.push("--------------------");
    lines.push("Use semantic HTML.");
    lines.push("Make interactive elements actually functional.");
    lines.push("Do not invent functionality that is not specified.");
    lines.push("Use the Type, Purpose, and Behavior fields to determine how each element should work.");
    lines.push("Treat the layout information as visual intent rather than pixel-perfect instructions.");
    lines.push("");

    lines.push("END OF SPECIFICATION");

    return lines.join("\n");
}

const copyButton = document.getElementById("copyButton");
const copyMessage = document.getElementById("copyMessage");

function showCopyMessage(message, success = true) {
    if (!copyMessage) return;

    copyMessage.textContent = message;
    copyMessage.classList.toggle("copy-success", success);
    copyMessage.classList.toggle("copy-error", !success);
    copyMessage.classList.add("show");

    clearTimeout(window.copyMessageTimer);
    window.copyMessageTimer = setTimeout(() => {
        copyMessage.classList.remove("show");
    }, 2500);
}

function copyTextToClipboard(text) {
    // Use the synchronous copy command first. This works when the user
    // opens the HTML directly from a file, where navigator.clipboard may
    // be unavailable because file:// is not a secure context.
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "0";
    textarea.style.top = "0";
    textarea.style.width = "1px";
    textarea.style.height = "1px";
    textarea.style.opacity = "0";
    textarea.style.pointerEvents = "none";
    document.body.appendChild(textarea);

    textarea.focus({ preventScroll: true });
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);

    let copied = false;
    try {
        copied = document.execCommand("copy");
    } catch (error) {
        copied = false;
    }

    textarea.remove();

    if (copied) return true;

    // If the browser supports the modern Clipboard API, try it as a
    // second option. This is intentionally a separate fallback so a
    // rejected promise cannot prevent the success toast.
    if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text)
            .then(() => true)
            .catch(() => false);
    }

    return false;
}

copyButton.addEventListener("click", async () => {
    const originalText = copyButton.textContent;
    copyButton.disabled = true;

    try {
        // This is intentionally plain text: an AI design brief, NOT HTML/CSS/JavaScript.
        const designBrief = generateExportText();
        const copied = await copyTextToClipboard(designBrief);

        if (!copied) {
            throw new Error("Clipboard copy was not available in this browser/context.");
        }

        copyButton.textContent = "Copied ✓";
        showCopyMessage("Copied to clipboard", true);

        setTimeout(() => {
            copyButton.textContent = originalText;
            copyButton.disabled = false;
        }, 1800);
    } catch (error) {
        console.error("Could not copy design brief:", error);
        copyButton.textContent = "Copy failed";
        showCopyMessage("Could not copy — please try again", false);

        setTimeout(() => {
            copyButton.textContent = originalText;
            copyButton.disabled = false;
        }, 1800);
    }
});


/* =========================================================
   INITIAL STATE
========================================================= */
ensureLayouts();
applyDevice(activeDevice);
