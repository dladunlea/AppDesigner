<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Planner</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --hue: 210;
    --primary: hsl(var(--hue), 30%, 90%);
    --secondary: hsl(var(--hue), 45%, 78%);
    --accent: hsl(var(--hue), 70%, 55%);
    --text: #17202a;
    --muted: #68737d;
    --border: #aeb7bf;

    --sidebar-width: 270px;
    --topbar-height: 58px;
    --bottom-bar-height: 58px;

    --cell-size: 20px;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #eef0f2;
}

/* =========================================================
   APP
========================================================= */

.app {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    grid-template-rows: var(--topbar-height) 1fr var(--bottom-bar-height);
    width: 100vw;
    height: 100vh;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    background: white;
    border-bottom: 1px solid #d4d9dd;
    z-index: 1000;
}

.brand {
    font-weight: 700;
    font-size: 17px;
    white-space: nowrap;
}

.project-name {
    flex: 1;
    max-width: 500px;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 600;
}

.project-name:hover,
.project-name:focus {
    border-color: #c5cbd0;
    outline: none;
}

.primary-button {
    border: none;
    border-radius: 6px;
    padding: 9px 15px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
}

.primary-button:hover {
    filter: brightness(.94);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    grid-column: 1;
    grid-row: 2 / 4;
    display: flex;
    flex-direction: column;
    background: white;
    border-right: 1px solid #d4d9dd;
    overflow: hidden;
    z-index: 500;
}

.sidebar-header {
    padding: 14px;
    border-bottom: 1px solid #e1e4e7;
}

.add-box-button {
    width: 100%;
    padding: 10px;
    border: 1px solid #c5cbd0;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-weight: 600;
}

.add-box-button:hover,
.add-box-button.active {
    border-color: var(--accent);
    background: hsl(var(--hue), 50%, 96%);
}

.box-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.box-list-empty {
    padding: 15px 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.box-list-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 8px;
    margin-bottom: 3px;
    border: none;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text);
}

.box-list-item:hover {
    background: #f1f3f4;
}

.box-list-item.selected {
    background: hsl(var(--hue), 60%, 93%);
}

.box-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.2);
    flex-shrink: 0;
}

.box-list-number {
    color: var(--muted);
    font-size: 11px;
    min-width: 38px;
}

.box-list-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================================================
   CANVAS AREA
========================================================= */

.canvas-area {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: auto;
}

.canvas {
    position: relative;
    width: 480px;
    height: 400px;
    margin: 40px;

    background-color: white;

    background-image:
        linear-gradient(to right, #dce1e5 1px, transparent 1px),
        linear-gradient(to bottom, #dce1e5 1px, transparent 1px);

    background-size:
        var(--cell-size) var(--cell-size);

    box-shadow:
        0 0 0 1px #c8cdd1;

    touch-action: none;
}

.canvas.add-mode {
    cursor: crosshair;
}

/* =========================================================
   BOX
========================================================= */

.layout-box {
    position: absolute;
    border: 2px solid rgba(60,70,80,.6);
    border-radius: 4px;
    cursor: grab;
    user-select: none;
    touch-action: none;
}

.layout-box:active {
    cursor: grabbing;
}

.layout-box.selected {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    z-index: 100;
}

.layout-box.parent-target {
    outline: 3px dashed var(--accent);
    outline-offset: 3px;
}

.box-content {
    position: absolute;
    inset: 0;
    padding: 5px;
    overflow: hidden;
    pointer-events: none;
}

.box-title {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.box-description {
    margin-top: 3px;
    font-size: 9px;
    line-height: 1.2;
    opacity: .72;
}

/* =========================================================
   RESIZE HANDLES
========================================================= */

.resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: white;
    border: 2px solid var(--accent);
    border-radius: 2px;
    z-index: 1000;
}

.resize-handle.tl {
    top: -6px;
    left: -6px;
    cursor: nwse-resize;
}

.resize-handle.tr {
    top: -6px;
    right: -6px;
    cursor: nesw-resize;
}

.resize-handle.bl {
    bottom: -6px;
    left: -6px;
    cursor: nesw-resize;
}

.resize-handle.br {
    bottom: -6px;
    right: -6px;
    cursor: nwse-resize;
}

/* =========================================================
   PROPERTY PANEL
========================================================= */

.property-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 270px;
    padding: 15px;
    background: white;
    border: 1px solid #d2d7db;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
    z-index: 300;
}

.property-panel.hidden {
    display: none;
}

.panel-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 13px;
}

.field {
    margin-bottom: 11px;
}

.field label {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border: 1px solid #cbd1d5;
    border-radius: 5px;
    padding: 7px;
    color: var(--text);
    background: white;
}

.field textarea {
    min-height: 58px;
    resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    outline: 2px solid hsl(var(--hue), 65%, 88%);
    border-color: var(--accent);
}

.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.number-input {
    width: 100%;
}

/* =========================================================
   COLOR ROLES
========================================================= */

.color-role {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.role-option {
    border: 1px solid #cbd1d5;
    border-radius: 5px;
    padding: 7px;
    background: white;
    cursor: pointer;
    font-size: 11px;
}

.role-option:hover {
    background: #f3f5f6;
}

.role-option.active {
    border-color: var(--accent);
    background: hsl(var(--hue), 60%, 94%);
}

.custom-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.custom-color-row input {
    width: 45px;
    height: 30px;
    padding: 2px;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar {
    grid-column: 2;
    grid-row: 3;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    background: white;
    border-top: 1px solid #d4d9dd;
    z-index: 500;
}

.temperature-label {
    font-size: 12px;
    font-weight: 700;
}

.cool {
    color: #356b96;
}

.warm {
    color: #ad5b35;
}

.hue-slider {
    width: 260px;
}

.hue-preview {
    width: 90px;
    height: 18px;
    border-radius: 10px;
    background:
        linear-gradient(
            to right,
            hsl(210,70%,55%),
            hsl(270,70%,55%),
            hsl(330,70%,55%),
            hsl(30,70%,55%),
            hsl(60,70%,55%)
        );
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,25,30,.35);
    z-index: 5000;
}

.modal-overlay.hidden {
    display: none;
}

.modal {
    width: 370px;
    max-width: calc(100vw - 30px);
    padding: 20px;
    background: white;
    border-radius: 9px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

.secondary-button {
    border: 1px solid #c7cdd1;
    border-radius: 6px;
    padding: 8px 13px;
    background: white;
    cursor: pointer;
}

/* =========================================================
   COPY MESSAGE
========================================================= */

.copy-message {
    position: fixed;
    top: 70px;
    right: 20px;
    padding: 9px 14px;
    background: #20262c;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-5px);
    transition: .2s;
    pointer-events: none;
    z-index: 6000;
}

.copy-message.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        Layout Planner
    </div>

    <input
        id="projectName"
        class="project-name"
        value="My Website Layout"
        aria-label="Project name"
    >

    <button
        id="copyButton"
        class="primary-button"
    >
        Copy to Clipboard
    </button>

</header>


<aside class="sidebar">

    <div class="sidebar-header">

        <button
            id="addBoxButton"
            class="add-box-button"
        >
            + Add Box
        </button>

    </div>

    <div
        id="boxList"
        class="box-list"
    ></div>

</aside>


<main
    id="canvasArea"
    class="canvas-area"
>

    <div
        id="canvas"
        class="canvas"
    ></div>

    <section
        id="propertyPanel"
        class="property-panel hidden"
    >

        <div class="panel-title">
            Box Properties
        </div>

        <div class="field">
            <label>Label</label>
            <input id="labelInput" type="text">
        </div>

        <div class="field">
            <label>Description</label>
            <textarea id="descriptionInput"></textarea>
        </div>

        <div class="field">

            <label>Position</label>

            <div class="two-column">

                <div>
                    <label>X / Column</label>
                    <input
                        id="xInput"
                        type="number"
                        min="1"
                        max="24"
                    >
                </div>

                <div>
                    <label>Y / Row</label>
                    <input
                        id="yInput"
                        type="number"
                        min="1"
                        max="20"
                    >
                </div>

            </div>

        </div>

        <div class="field">

            <label>Size</label>

            <div class="two-column">

                <div>
                    <label>Width</label>
                    <input
                        id="widthInput"
                        type="number"
                        min="1"
                        max="24"
                    >
                </div>

                <div>
                    <label>Height</label>
                    <input
                        id="heightInput"
                        type="number"
                        min="1"
                        max="20"
                    >
                </div>

            </div>

        </div>

        <div class="field">

            <label>Parent</label>

            <select id="parentInput">
            </select>

        </div>

        <div class="field">

            <label>Color Role</label>

            <div
                id="colorRole"
                class="color-role"
            >

                <button
                    class="role-option"
                    data-role="primary"
                >
                    Primary
                </button>

                <button
                    class="role-option"
                    data-role="secondary"
                >
                    Secondary
                </button>

                <button
                    class="role-option"
                    data-role="accent"
                >
                    Accent
                </button>

                <button
                    class="role-option"
                    data-role="custom"
                >
                    Custom
                </button>

            </div>

            <div
                id="customColorRow"
                class="custom-color-row"
                style="display:none;"
            >

                <span>Custom</span>

                <input
                    id="customColorInput"
                    type="color"
                    value="#8aa8c8"
                >

            </div>

        </div>

    </section>

</main>


<footer class="bottom-bar">

    <span class="temperature-label cool">
        Cool
    </span>

    <input
        id="hueSlider"
        class="hue-slider"
        type="range"
        min="0"
        max="100"
        value="0"
    >

    <span class="temperature-label warm">
        Warm
    </span>

    <div class="hue-preview"></div>

</footer>

</div>


<!-- CREATE BOX MODAL -->

<div
    id="modalOverlay"
    class="modal-overlay hidden"
>

    <div class="modal">

        <h2>Create Box</h2>

        <div class="field">

            <label>Label</label>

            <input
                id="modalLabel"
                type="text"
                placeholder="Example: Header"
            >

        </div>

        <div class="field">

            <label>Description</label>

            <textarea
                id="modalDescription"
                placeholder="Example: Top navigation bar"
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                id="cancelModal"
                class="secondary-button"
            >
                Cancel
            </button>

            <button
                id="createModal"
                class="primary-button"
            >
                Create Box
            </button>

        </div>

    </div>

</div>


<div
    id="copyMessage"
    class="copy-message"
>
    Copied!
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const GRID_COLUMNS = 24;
const GRID_ROWS = 20;
const CELL_SIZE = 20;
const MAX_DEPTH = 5;


/* =========================================================
   STATE
========================================================= */

let boxes = [];
let selectedBoxId = null;
let nextBoxNumber = 1;

let addMode = false;

let createStart = null;
let creating = false;

let interaction = null;


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("canvas");

const canvasArea =
    document.getElementById("canvasArea");

const boxList =
    document.getElementById("boxList");

const addBoxButton =
    document.getElementById("addBoxButton");

const propertyPanel =
    document.getElementById("propertyPanel");

const projectNameInput =
    document.getElementById("projectName");

const hueSlider =
    document.getElementById("hueSlider");


/* =========================================================
   CANVAS
========================================================= */

canvas.style.width =
    `${GRID_COLUMNS * CELL_SIZE}px`;

canvas.style.height =
    `${GRID_ROWS * CELL_SIZE}px`;


/* =========================================================
   BOX HELPERS
========================================================= */

function getBox(id) {
    return boxes.find(
        box => box.id === id
    );
}


function getChildren(parentId) {
    return boxes.filter(
        box => box.parentId === parentId
    );
}


function getAncestors(box) {

    const result = [];

    let current =
        getBox(box.parentId);

    while (current) {

        result.push(current);

        current =
            getBox(current.parentId);
    }

    return result;
}


function getDepth(box) {

    return getAncestors(box).length + 1;
}


function isDescendant(
    boxId,
    possibleAncestorId
) {

    let current =
        getBox(boxId);

    while (current && current.parentId) {

        if (
            current.parentId ===
            possibleAncestorId
        ) {
            return true;
        }

        current =
            getBox(current.parentId);
    }

    return false;
}


/* =========================================================
   ABSOLUTE COORDINATES
========================================================= */

function getAbsolutePosition(box) {

    let x = box.x;
    let y = box.y;

    let parent =
        getBox(box.parentId);

    while (parent) {

        x += parent.x;
        y += parent.y;

        parent =
            getBox(parent.parentId);
    }

    return { x, y };
}


function getAbsoluteRect(box) {

    const position =
        getAbsolutePosition(box);

    return {

        x: position.x,

        y: position.y,

        width: box.width,

        height: box.height
    };
}


/* =========================================================
   GEOMETRY
========================================================= */

function overlaps(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function contains(parent, child) {

    return (
        child.x >= parent.x &&
        child.y >= parent.y &&
        child.x + child.width <=
            parent.x + parent.width &&
        child.y + child.height <=
            parent.y + parent.height
    );
}


function snap(value) {

    return Math.round(
        value / CELL_SIZE
    );
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* =========================================================
   VALIDATION
========================================================= */

function canPlace(
    box,
    absoluteX,
    absoluteY,
    width,
    height,
    parentId
) {

    const test = {

        x: absoluteX,

        y: absoluteY,

        width,

        height
    };


    /* Canvas boundaries */

    if (
        absoluteX < 0 ||
        absoluteY < 0 ||
        absoluteX + width >
            GRID_COLUMNS ||
        absoluteY + height >
            GRID_ROWS
    ) {
        return false;
    }


    /* Parent boundary */

    if (parentId) {

        const parent =
            getBox(parentId);

        if (!parent) {
            return false;
        }

        const parentRect =
            getAbsoluteRect(parent);

        if (
            !contains(
                parentRect,
                test
            )
        ) {
            return false;
        }
    }


    /* Sibling collisions */

    for (const other of boxes) {

        if (
            other.id === box.id
        ) {
            continue;
        }

        if (
            other.parentId !==
            parentId
        ) {
            continue;
        }

        const otherRect =
            getAbsoluteRect(other);

        if (
            overlaps(
                test,
                otherRect
            )
        ) {
            return false;
        }
    }


    return true;
}


/* =========================================================
   CAN A PARENT BE RESIZED?
========================================================= */

function canResizeParent(
    box,
    newAbsoluteRect
) {

    const children =
        getChildren(box.id);

    for (const child of children) {

        const childRect =
            getAbsoluteRect(child);

        if (
            !contains(
                newAbsoluteRect,
                childRect
            )
        ) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   COLORS
========================================================= */

function currentHue() {

    return (
        210 +
        Number(hueSlider.value) * 1.5
    );
}


function getBoxColor(box) {

    const hue =
        currentHue();

    switch (box.colorRole) {

        case "secondary":
            return `hsl(${hue},45%,78%)`;

        case "accent":
            return `hsl(${hue},70%,55%)`;

        case "custom":
            return box.customColor;

        default:
            return `hsl(${hue},30%,90%)`;
    }
}


function contrastColor(hex) {

    const value =
        hex.replace("#","");

    const r =
        parseInt(
            value.substring(0,2),
            16
        );

    const g =
        parseInt(
            value.substring(2,4),
            16
        );

    const b =
        parseInt(
            value.substring(4,6),
            16
        );

    const brightness =
        (r * 299 +
         g * 587 +
         b * 114) / 1000;

    return brightness > 150
        ? "#17202a"
        : "#ffffff";
}


function getBoxTextColor(box) {

    if (
        box.colorRole === "custom"
    ) {
        return contrastColor(
            box.customColor
        );
    }

    if (
        box.colorRole === "accent"
    ) {
        return "#ffffff";
    }

    return "#17202a";
}


hueSlider.addEventListener(
    "input",
    () => {

        renderBoxes();
        renderSidebar();

        if (selectedBoxId) {
            updatePropertyPanel();
        }
    }
);


/* =========================================================
   RENDER
========================================================= */

function renderBoxes() {

    canvas
        .querySelectorAll(".layout-box")
        .forEach(
            element =>
                element.remove()
        );


    /*
       Parents first.
    */

    const sorted =
        [...boxes].sort(
            (a,b) =>
                getDepth(a) -
                getDepth(b)
        );


    sorted.forEach(box => {

        const element =
            document.createElement("div");

        element.className =
            "layout-box";

        element.dataset.id =
            box.id;


        /*
           IMPORTANT:
           The box's x/y are always
           relative to its parent.
        */

        element.style.left =
            `${box.x * CELL_SIZE}px`;

        element.style.top =
            `${box.y * CELL_SIZE}px`;

        element.style.width =
            `${box.width * CELL_SIZE}px`;

        element.style.height =
            `${box.height * CELL_SIZE}px`;


        element.style.background =
            getBoxColor(box);

        element.style.color =
            getBoxTextColor(box);


        if (
            box.id === selectedBoxId
        ) {
            element.classList.add(
                "selected"
            );
        }


        element.innerHTML = `

            <div class="box-content">

                <div class="box-title">
                    ${escapeHTML(
                        box.label ||
                        `Box ${box.number}`
                    )}
                </div>

                <div class="box-description">
                    ${escapeHTML(
                        box.description || ""
                    )}
                </div>

            </div>
        `;


        if (
            box.id === selectedBoxId
        ) {

            ["tl","tr","bl","br"]
                .forEach(
                    position => {

                        const handle =
                            document.createElement(
                                "div"
                            );

                        handle.className =
                            `resize-handle ${position}`;

                        handle.dataset.handle =
                            position;

                        element.appendChild(
                            handle
                        );
                    }
                );
        }


        element.addEventListener(
            "pointerdown",
            boxPointerDown
        );


        canvas.appendChild(
            element
        );
    });
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar() {

    boxList.innerHTML = "";

    if (
        boxes.length === 0
    ) {

        boxList.innerHTML = `
            <div class="box-list-empty">
                No boxes yet.<br>
                Click <strong>+ Add Box</strong>
                to begin.
            </div>
        `;

        return;
    }


    boxes.forEach(box => {

        const button =
            document.createElement("button");

        button.className =
            "box-list-item";

        if (
            box.id === selectedBoxId
        ) {
            button.classList.add(
                "selected"
            );
        }


        const indent =
            (getDepth(box) - 1) * 12;


        button.style.paddingLeft =
            `${8 + indent}px`;


        button.innerHTML = `

            <span
                class="box-color"
                style="
                    background:${getBoxColor(box)}
                "
            ></span>

            <span class="box-list-number">
                Box ${box.number}
            </span>

            <span class="box-list-label">
                ${escapeHTML(
                    box.label ||
                    "Untitled"
                )}
            </span>

        `;


        button.addEventListener(
            "click",
            () => selectBox(box.id)
        );


        boxList.appendChild(

        );
    });
}

/* =========================================================
   PARENT SELECT
========================================================= */

function populateParentSelect(box) {

    const select =
        document.getElementById(
            "parentInput"
        );

    select.innerHTML = "";


    const none =
        document.createElement("option");

    none.value = "";

    none.textContent =
        "None (Top Level)";

    select.appendChild(
        none
    );


    boxes.forEach(candidate => {

        if (
            candidate.id === box.id
        ) {
            return;
        }


        /*
           Cannot select a descendant.
        */

        if (
            isDescendant(
                candidate.id,
                box.id
            )
        ) {
            return;
        }


        /*
           A parent at depth 5
           cannot accept another level.
        */

        if (
            getDepth(candidate) >=
            MAX_DEPTH
        ) {
            return;
        }


        const option =
            document.createElement(
                "option"
            );

        option.value =
            candidate.id;

        option.textContent =
            `Box ${candidate.number} (${candidate.label || "Untitled"})`;

        if (
            candidate.id ===
            box.parentId
        ) {
            option.selected =
                true;
        }

        select.appendChild(
            option
        );
    });
}

/* =========================================================
   POSITION / SIZE EDITING
========================================================= */

function applyPropertyChange() {

    const box =
        getBox(selectedBoxId);

    if (!box) return;


    const newX =
        Number(
            document.getElementById(
                "xInput"
            ).value
        ) - 1;


    const newY =
        Number(
            document.getElementById(
                "yInput"
            ).value
        ) - 1;


    const newWidth =
        Number(
            document.getElementById(
                "widthInput"
            ).value
        );


    const newHeight =
        Number(
            document.getElementById(
                "heightInput"
            ).value
        );


    if (
        !Number.isInteger(newX) ||
        !Number.isInteger(newY) ||
        !Number.isInteger(newWidth) ||
        !Number.isInteger(newHeight)
    ) {
        updatePropertyPanel();
        return;
    }


    if (
        newWidth < 1 ||
        newHeight < 1
    ) {
        updatePropertyPanel();
        return;
    }


    /*
       Convert the proposed local
       position to absolute position.
    */

    let absoluteX =
        newX;

    let absoluteY =
        newY;


    const parent =
        getBox(box.parentId);


    if (parent) {

        const parentAbsolute =
            getAbsolutePosition(
                parent
            );

        absoluteX +=
            parentAbsolute.x;

        absoluteY +=
            parentAbsolute.y;
    }


    /*
       If changing the size/position of
       the parent, make sure its children
       still fit.
    */

    if (
        !canPlace(
            box,
            absoluteX,
            absoluteY,
            newWidth,
            newHeight,
            box.parentId
        )
    ) {

        updatePropertyPanel();

        return;
    }


    const oldAbsolute =
        getAbsolutePosition(box);


    const dx =
        absoluteX -
        oldAbsolute.x;

    const dy =
        absoluteY -
        oldAbsolute.y;


    /*
       If the box moves, its descendants
       visually move with it because they
       retain their local coordinates.
    */


    box.x =
        newX;

    box.y =
        newY;

    box.width =
        newWidth;

    box.height =
        newHeight;


    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}


[
    "xInput",
    "yInput",
    "widthInput",
    "heightInput"
].forEach(id => {

    document.getElementById(id)
        .addEventListener(
            "change",
            applyPropertyChange
        );
});


/* =========================================================
   CHANGE PARENT
========================================================= */

document.getElementById(
    "parentInput"
).addEventListener(
    "change",
    event => {

        const box =
            getBox(selectedBoxId);

        if (!box) return;


        const newParentId =
            event.target.value || null;


        if (
            newParentId ===
            box.parentId
        ) {
            return;
        }


        if (
            newParentId &&
            getDepth(
                getBox(newParentId)
            ) >= MAX_DEPTH
        ) {

            updatePropertyPanel();

            return;
        }


        /*
           Preserve the box's absolute
           position when changing parent.
        */

        const absolute =
            getAbsolutePosition(box);


        let newX =
            absolute.x;

        let newY =
            absolute.y;


        if (newParentId) {

            const parent =
                getBox(newParentId);

            const parentAbsolute =
                getAbsolutePosition(
                    parent
                );

            newX =
                absolute.x -
                parentAbsolute.x;

            newY =
                absolute.y -
                parentAbsolute.y;


            const test = {

                x: newX,

                y: newY,

                width: box.width,

                height: box.height
            };


            if (
                !contains(
                    {
                        x: 0,
                        y: 0,
                        width: parent.width,
                        height: parent.height
                    },
                    test
                )
            ) {

                updatePropertyPanel();

                return;
            }
        }


        box.parentId =
            newParentId;

        box.x =
            newX;

        box.y =
            newY;


        if (
            !canPlace(
                box,
                absolute.x,
                absolute.y,
                box.width,
                box.height,
                newParentId
            )
        ) {

            /*
               Undo if invalid.
            */

            box.parentId =
                box.parentId;

            updatePropertyPanel();

            return;
        }


        renderBoxes();
        renderSidebar();
        updatePropertyPanel();
    }
);

/* =========================================================
   CREATE BOX BY DRAGGING
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (!addMode) {
            return;
        }


        if (
            event.target !== canvas
        ) {
            return;
        }


        const rect =
            canvas.getBoundingClientRect();


        const x =
            clamp(
                snap(
                    event.clientX -
                    rect.left
                ),
                0,
                GRID_COLUMNS - 1
            );


        const y =
            clamp(
                snap(
                    event.clientY -
                    rect.top
                ),
                0,
                GRID_ROWS - 1
            );


        createStart = {
            x,
            y
        };

        creating = true;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        if (!creating) {
            return;
        }


        creating = false;

        canvas.releasePointerCapture(
            event.pointerId
        );


        const rect =
            canvas.getBoundingClientRect();


        const endX =
            clamp(
                snap(
                    event.clientX -
                    rect.left
                ),
                0,
                GRID_COLUMNS - 1
            );


        const endY =
            clamp(
                snap(
                    event.clientY -
                    rect.top
                ),
                0,
                GRID_ROWS - 1
            );


        let x =
            Math.min(
                createStart.x,
                endX
            );


        let y =
            Math.min(
                createStart.y,
                endY
            );


        let width =
            Math.abs(
                endX -
                createStart.x
            ) + 1;


        let height =
            Math.abs(
                endY -
                createStart.y
            ) + 1;


        width =
            Math.min(
                width,
                GRID_COLUMNS - x
            );


        height =
            Math.min(
                height,
                GRID_ROWS - y
            );


        pendingBox = {

            x,
            y,
            width,
            height
        };


        openModal();
    }
);

function createBox() {

    if (!pendingBox) {
        return;
    }


    const number =
        nextBoxNumber++;


    const label =
        document.getElementById(
            "modalLabel"
        ).value.trim();


    const description =
        document.getElementById(
            "modalDescription"
        ).value.trim();


    const box = {

        id:
            crypto.randomUUID(),

        number,

        label:
            label ||
            `Box ${number}`,

        description,

        x:
            pendingBox.x,

        y:
            pendingBox.y,

        width:
            pendingBox.width,

        height:
            pendingBox.height,

        parentId:
            null,

        colorRole:
            "primary",

        customColor:
            "#8aa8c8"
    };


    /*
       Do not allow creation over
       an existing box.
    */

    if (
        !canPlace(
            box,
            box.x,
            box.y,
            box.width,
            box.height,
            null
        )
    ) {

        alert(
            "This box overlaps another box. Please choose a different area."
        );

        return;
    }


    boxes.push(box);

    closeModal();

    selectBox(box.id);
}


/* =========================================================
   DRAGGING
========================================================= */

function boxPointerDown(event) {

    event.stopPropagation();

    const element =
        event.currentTarget;

    const box =
        getBox(
            element.dataset.id
        );

    if (!box) {
        return;
    }


    selectBox(box.id);


    /*
       Resize?
    */

    const handle =
        event.target.dataset.handle;


    if (handle) {

        beginResize(
            event,
            box,
            handle,
            element
        );

        return;
    }


    beginDrag(
        event,
        box,
        element
    );
}


/* =========================================================
   BEGIN DRAG
========================================================= */

function beginDrag(
    event,
    box,
    element
) {

    const absolute =
        getAbsolutePosition(box);


    interaction = {

        type: "drag",

        boxId: box.id,

        pointerId:
            event.pointerId,

        startMouseX:
            event.clientX,

        startMouseY:
            event.clientY,

        startAbsoluteX:
            absolute.x,

        startAbsoluteY:
            absolute.y,

        originalX:
            box.x,

        originalY:
            box.y,

        originalParentId:
            box.parentId,

        element
    };


    element.setPointerCapture(
        event.pointerId
    );


    element.addEventListener(
        "pointermove",
        handleDrag,
        { passive: false }
    );


    element.addEventListener(
        "pointerup",
        handleDragEnd,
        { once: true }
    );


    element.addEventListener(
        "pointercancel",
        handleDragEnd,
        { once: true }
    );
}


/* =========================================================
   DRAG
========================================================= */

function handleDrag(event) {

    if (
        !interaction ||
        interaction.type !== "drag"
    ) {
        return;
    }


    event.preventDefault();


    const box =
        getBox(
            interaction.boxId
        );


    if (!box) {
        return;
    }


    const dx =
        snap(
            event.clientX -
            interaction.startMouseX
        );


    const dy =
        snap(
            event.clientY -
            interaction.startMouseY
        );


    const newAbsoluteX =
        interaction.startAbsoluteX +
        dx;


    const newAbsoluteY =
        interaction.startAbsoluteY +
        dy;


    /*
       Check for a potential parent.
    */

    const targetParent =
        findParentForRect(
            box,
            newAbsoluteX,
            newAbsoluteY,
            box.width,
            box.height
        );


    highlightParent(
        targetParent
    );


    /*
       If we're hovering over another
       box, allow the visual position
       to move there only if it can fit.
    */

    let proposedParent =
        box.parentId;


    let localX =
        newAbsoluteX;


    let localY =
        newAbsoluteY;


    if (
        targetParent &&
        targetParent.id !== box.id
    ) {

        if (
            !isDescendant(
                targetParent.id,
                box.id
            ) &&
            getDepth(targetParent) <
                MAX_DEPTH
        ) {

            const parentAbsolute =
                getAbsolutePosition(
                    targetParent
                );


            const candidateX =
                newAbsoluteX -
                parentAbsolute.x;


            const candidateY =
                newAbsoluteY -
                parentAbsolute.y;


            const candidate = {

                x:
                    candidateX,

                y:
                    candidateY,

                width:
                    box.width,

                height:
                    box.height
            };


            const parentBounds = {

                x: 0,

                y: 0,

                width:
                    targetParent.width,

                height:
                    targetParent.height
            };


            if (
                contains(
                    parentBounds,
                    candidate
                )
            ) {

                proposedParent =
                    targetParent.id;

                localX =
                    candidateX;

                localY =
                    candidateY;
            }
        }
    }


    /*
       If not nesting, keep the current
       parent and convert absolute
       coordinates to local coordinates.
    */

    if (
        proposedParent ===
        box.parentId
    ) {

        const parent =
            getBox(
                box.parentId
            );


        if (parent) {

            const parentAbsolute =
                getAbsolutePosition(
                    parent
                );

            localX =
                newAbsoluteX -
                parentAbsolute.x;

            localY =
                newAbsoluteY -
                parentAbsolute.y;
        }
    }


    /*
       Validate placement against siblings.
    */

    const valid =
        canPlaceAbsolute(
            box,
            newAbsoluteX,
            newAbsoluteY,
            box.width,
            box.height,
            proposedParent
        );


    if (!valid) {

        return;
    }


    /*
       Temporarily update the model,
       but DON'T re-render the DOM.
    */

    box.parentId =
        proposedParent;

    box.x =
        localX;

    box.y =
        localY;


    /*
       Move the existing DOM element.
       This is what fixes the original
       dragging bug.
    */

    element.style.left =
        `${localX * CELL_SIZE}px`;

    element.style.top =
        `${localY * CELL_SIZE}px`;


    /*
       If parent changed, the DOM hierarchy
       needs to change. In that case,
       re-render once.
    */

    if (
        proposedParent !==
        interaction.originalParentId
    ) {

        renderBoxes();
        renderSidebar();
        updatePropertyPanel();

        interaction.originalParentId =
            proposedParent;
    }
}


/* =========================================================
   DRAG END
========================================================= */

function handleDragEnd() {

    if (!interaction) {
        return;
    }


    clearParentHighlight();


    const box =
        getBox(
            interaction.boxId
        );


    if (box) {

        /*
           Final validation.
        */

        const absolute =
            getAbsolutePosition(box);


        if (
            !canPlaceAbsolute(
                box,
                absolute.x,
                absolute.y,
                box.width,
                box.height,
                box.parentId
            )
        ) {

            /*
               Restore original position
               if something became invalid.
            */

            box.parentId =
                interaction.originalParentId;

            box.x =
                interaction.originalX;

            box.y =
                interaction.originalY;
        }
    }


    interaction = null;


    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}


/* =========================================================
   FIND PARENT
========================================================= */

function findParentForRect(
    box,
    absoluteX,
    absoluteY,
    width,
    height
) {

    const test = {

        x:
            absoluteX,

        y:
            absoluteY,

        width,

        height
    };


    let best = null;


    boxes.forEach(candidate => {

        if (
            candidate.id ===
            box.id
        ) {
            return;
        }


        if (
            isDescendant(
                candidate.id,
                box.id
            )
        ) {
            return;
        }


        if (
            getDepth(candidate) >=
            MAX_DEPTH
        ) {
            return;
        }


        const candidateRect =
            getAbsoluteRect(
                candidate
            );


        if (
            contains(
                candidateRect,
                test
            )
        ) {

            if (
                !best ||
                getDepth(candidate) >
                    getDepth(best)
            ) {

                best =
                    candidate;
            }
        }
    });


    return best;
}


function highlightParent(box) {

    canvas
        .querySelectorAll(
            ".parent-target"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "parent-target"
                )
        );


    if (!box) {
        return;
    }


    const element =
        canvas.querySelector(
            `[data-id="${box.id}"]`
        );


    if (element) {

        element.classList.add(
            "parent-target"
        );
    }
}


function clearParentHighlight() {

    canvas
        .querySelectorAll(
            ".parent-target"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "parent-target"
                )
        );
}


/* =========================================================
   ABSOLUTE PLACEMENT VALIDATION
========================================================= */

function canPlaceAbsolute(
    box,
    absoluteX,
    absoluteY,
    width,
    height,
    parentId
) {

    const test = {

        x:
            absoluteX,

        y:
            absoluteY,

        width,

        height
    };


    /*
       Canvas bounds.
    */

    if (
        absoluteX < 0 ||
        absoluteY < 0 ||
        absoluteX + width >
            GRID_COLUMNS ||
        absoluteY + height >
            GRID_ROWS
    ) {
        return false;
    }


    /*
       Parent bounds.
    */

    if (parentId) {

        const parent =
            getBox(parentId);


        if (!parent) {
            return false;
        }


        const parentRect =
            getAbsoluteRect(
                parent
            );


        if (
            !contains(
                parentRect,
                test
            )
        ) {
            return false;
        }
    }


    /*
       Sibling collision.
    */

    for (const other of boxes) {

        if (
            other.id === box.id
        ) {
            continue;
        }


        if (
            other.parentId !==
            parentId
        ) {
            continue;
        }


        const otherRect =
            getAbsoluteRect(
                other
            );


        if (
            overlaps(
                test,
                otherRect
            )
        ) {
            return false;
        }
    }


    return true;
}


/* =========================================================
   RESIZING
========================================================= */

function beginResize(
    event,
    box,
    handle,
    element
) {

    const absolute =
        getAbsolutePosition(box);


    interaction = {

        type: "resize",

        boxId:
            box.id,

        handle,

        pointerId:
            event.pointerId,

        startMouseX:
            event.clientX,

        startMouseY:
            event.clientY,

        startX:
            absolute.x,

        startY:
            absolute.y,

        startWidth:
            box.width,

        startHeight:
            box.height,

        element
    };


    element.setPointerCapture(
        event.pointerId
    );


    element.addEventListener(
        "pointermove",
        handleResize,
        { passive: false }
    );


    element.addEventListener(
        "pointerup",
        handleResizeEnd,
        { once: true }
    );


    element.addEventListener(
        "pointercancel",
        handleResizeEnd,
        { once: true }
    );
}


function handleResize(event) {

    if (
        !interaction ||
        interaction.type !== "resize"
    ) {
        return;
    }


    event.preventDefault();


    const box =
        getBox(
            interaction.boxId
        );


    if (!box) {
        return;
    }


    const dx =
        snap(
            event.clientX -
            interaction.startMouseX
        );


    const dy =
        snap(
            event.clientY -
            interaction.startMouseY
        );


    let x =
        interaction.startX;

    let y =
        interaction.startY;

    let width =
        interaction.startWidth;

    let height =
        interaction.startHeight;


    /*
       Right edge
    */

    if (
        interaction.handle.includes("r")
    ) {

        width =
            interaction.startWidth +
            dx;
    }


    /*
       Left edge
    */

    if (
        interaction.handle.includes("l")
    ) {

        x =
            interaction.startX +
            dx;

        width =
            interaction.startWidth -
            dx;
    }


    /*
       Bottom edge
    */

    if (
        interaction.handle.includes("b")
    ) {

        height =
            interaction.startHeight +
            dy;
    }


    /*
       Top edge
    */

    if (
        interaction.handle.includes("t")
    ) {

        y =
            interaction.startY +
            dy;

        height =
            interaction.startHeight -
            dy;
    }


    width =
        Math.max(1, width);

    height =
        Math.max(1, height);


    /*
       Parent boundary.
    */

    if (
        box.parentId
    ) {

        const parent =
            getAbsoluteRect(
                getBox(
                    box.parentId
                )
            );


        if (
            x < parent.x ||
            y < parent.y ||
            x + width >
                parent.x +
                parent.width ||
            y + height >
                parent.y +
                parent.height
        ) {

            return;
        }
    }


    /*
       Sibling collision.
    */

    if (
        !canPlaceAbsolute(
            box,
            x,
            y,
            width,
            height,
            box.parentId
        )
    ) {

        return;
    }


    /*
       Children must remain inside.
    */

    const newRect = {

        x,

        y,

        width,

        height
    };


    if (
        !canResizeParent(
            box,
            newRect
        )
    ) {

        return;
    }


    /*
       Update box coordinates.
    */

    const parent =
        getBox(box.parentId);


    if (parent) {

        const parentAbsolute =
            getAbsolutePosition(
                parent
            );


        box.x =
            x -
            parentAbsolute.x;

        box.y =
            y -
            parentAbsolute.y;

    } else {

        box.x =
            x;

        box.y =
            y;
    }


    box.width =
        width;

    box.height =
        height;


    /*
       Update existing DOM element.
       Don't re-render during resize.
    */

    element.style.left =
        `${box.x * CELL_SIZE}px`;

    element.style.top =
        `${box.y * CELL_SIZE}px`;

    element.style.width =
        `${width * CELL_SIZE}px`;

    element.style.height =
        `${height * CELL_SIZE}px`;
}


/* =========================================================
   RESIZE END
========================================================= */

function handleResizeEnd() {

    interaction = null;

    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}


/* =========================================================
   DELETE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const tag =
            event.target.tagName;


        /*
           Don't delete while typing.
        */

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"
        ) {
            return;
        }


        if (
            event.key === "Delete" &&
            selectedBoxId
        ) {

            deleteBox(
                selectedBoxId
            );
        }


        if (
            event.key === "Escape"
        ) {

            addMode = false;

            addBoxButton.classList.remove(
                "active"
            );

            canvas.classList.remove(
                "add-mode"
            );

            closeModal();

            clearParentHighlight();
        }
    }
);


function deleteBox(id) {

    const ids =
        new Set([id]);


    let changed = true;


    while (changed) {

        changed = false;


        boxes.forEach(box => {

            if (
                box.parentId &&
                ids.has(
                    box.parentId
                ) &&
                !ids.has(box.id)
            ) {

                ids.add(
                    box.id
                );

                changed = true;
            }
        });
    }


    boxes =
        boxes.filter(
            box =>
                !ids.has(
                    box.id
                )
        );


    selectedBoxId = null;


    renderBoxes();
    renderSidebar();
    updatePropertyPanel();
}


/* =========================================================
   CANVAS SELECTION
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target === canvas &&
            !addMode
        ) {

            selectedBoxId = null;

            renderBoxes();
            renderSidebar();
            updatePropertyPanel();
        }
    }
);


/* =========================================================
   COPY
========================================================= */

function positionText(box) {

    const absolute =
        getAbsolutePosition(box);


    const startColumn =
        absolute.x + 1;

    const endColumn =
        absolute.x +
        box.width;


    const startRow =
        absolute.y + 1;

    const endRow =
        absolute.y +
        box.height;


    const columns =
        startColumn === endColumn
            ? `${startColumn}`
            : `${startColumn}-${endColumn}`;


    const rows =
        startRow === endRow
            ? `${startRow}`
            : `${startRow}-${endRow}`;


    return (
        `Row ${rows}, Columns ${columns}`
    );
}


function generateExportText() {

    let text =
        `PROJECT: ${
            projectNameInput.value.trim() ||
            "Untitled Project"
        }\n\n`;


    boxes.forEach(box => {

        const parent =
            getBox(box.parentId);


        let color;


        if (
            box.colorRole ===
            "primary"
        ) {

            color =
                "Primary (60%)";

        } else if (
            box.colorRole ===
            "secondary"
        ) {

            color =
                "Secondary (30%)";

        } else if (
            box.colorRole ===
            "accent"
        ) {

            color =
                "Accent (10%)";

        } else {

            color =
                `Custom (${box.customColor})`;
        }


        text +=
`BOX ${box.number}: ${box.label || "Untitled"}
Description: ${box.description || ""}
Position: ${positionText(box)}
Size: ${box.width} columns × ${box.height} rows
Parent: ${
    parent
        ? `Box ${parent.number} (${parent.label || "Untitled"})`
        : "None"
}
Color: ${color}

`;
    });


    return text.trim();
}


document.getElementById(
    "copyButton"
).addEventListener(
    "click",
    async () => {

        const text =
            generateExportText();


        try {

            await navigator.clipboard.writeText(
                text
            );

        } catch {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();
        }


        const message =
            document.getElementById(
                "copyMessage"
            );


        message.classList.add(
            "show"
        );


        setTimeout(
            () =>
                message.classList.remove(
                    "show"
                ),
            2000
        );
    }
);


/* =========================================================
   MODAL BACKDROP
========================================================= */

document.getElementById(
    "modalOverlay"
).addEventListener(
    "pointerdown",
    event => {

        if (
            event.target ===
            event.currentTarget
        ) {

            closeModal();
        }
    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

renderBoxes();
renderSidebar();

</script>

</body>
</html>
